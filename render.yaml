services:
  # 1. Django Daphne ASGI Backend
  - type: web
    name: doubtbox-api
    runtime: python
    rootDir: backend
    buildCommand: "bash build.sh"
    startCommand: "daphne -b 0.0.0.0 -p $PORT config.asgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: doubtbox-db
          property: connectionString

  # 2. Vite React Frontend
  - type: web
    name: doubtbox-web
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: doubtbox-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_WS_URL
        fromService:
          type: web
          name: doubtbox-api
          envVarKey: RENDER_EXTERNAL_URL

databases:
  # 3. Managed PostgreSQL Database
  - name: doubtbox-db
    databaseName: doubtbox
    user: doubtbox_user
    plan: free
